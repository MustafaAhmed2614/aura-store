services:
  - type: web
    name: bazaar-retail-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: HHC_LIVE_ORDERS_ENABLED
        value: "false"
      - key: HHC_PRODUCTION_APPROVED
        value: "false"
